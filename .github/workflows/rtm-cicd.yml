name: RTM CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.1

      - name: Run pre-commit
        run: pre-commit run --all-files

  build-and-test:
    name: Build and smoke test
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action == 'review_requested' &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o rtm .

      - name: Smoke test
        run: bash scripts/smoke-test.sh ./rtm
